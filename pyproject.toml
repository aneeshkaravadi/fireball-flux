[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fireball-flux"
version = "0.1.0"
description = "How often fireball-sized space rocks hit Earth (NASA CNEOS data), and whether simple entry physics predicts the altitude where they explode."
authors = [{ name = "Aneesh Karavadi" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
